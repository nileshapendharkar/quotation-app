services:
  - type: web
    name: quotation-app-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: ganesh_gouri_quotation_jwt_secret_key_2026
      - key: MONGODB_URI
        sync: false   # Set in Render dashboard (e.g. mongodb+srv://...)
      - key: MONGODB_DB_NAME
        value: quotation_app
